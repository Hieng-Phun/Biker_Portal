{% extends "bikeportal/base.html" %} 
{% block title %}Log In - BikePortal
{%endblock %} 
{% block content %}
<div
  class="max-w-md mx-auto p-8 bg-white rounded-xl shadow-2xl border-t-4 border-primary"
>
  <h2 class="text-4xl font-extrabold text-secondary mb-2 text-center">
    Welcome Back
  </h2>
  <p class="text-center text-gray-500 mb-8">
    Sign in to access your cart and manage bookings.
  </p>

  <form method="POST" action="{% url 'login' %}" class="space-y-6">
    {% csrf_token %}

    <div>
      <label for="username" class="block text-sm font-medium text-gray-700"
        >Username</label
      >
      <input
        type="text"
        name="username"
        id="username"
        required
        class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-primary focus:border-primary"
        placeholder="Your registered username"
      />
    </div>

    <div>
      <label for="password" class="block text-sm font-medium text-gray-700"
        >Password</label
      >
      <input
        type="password"
        name="password"
        id="password"
        required
        class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-primary focus:border-primary"
        placeholder="Your password"
      />
    </div>

    <button
      type="submit"
      class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-lg text-lg font-semibold text-white bg-primary hover:bg-indigo-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition duration-300 transform hover:scale-[1.01]"
    >
      Log In
    </button>
  </form>

  <div class="mt-6 text-center">
    <p class="text-sm text-gray-600">
      Don't have an account?
      <a
        href="{% url 'signup' %}"
        class="font-medium text-success hover:text-green-600 transition duration-300"
      >
        Create Account
      </a>
    </p>
  </div>
</div>
{% endblock %}
